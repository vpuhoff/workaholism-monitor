server {
    listen 127.0.0.1:8080;
    server_name localhost;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name virtual-ubuntu localhost;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Cache-Control "no-cache";

    # The public CA certificate is safe to download; no private keys are served.
    location = /local-ca.crt {
        alias /etc/nginx/tls/local-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="workaholism-monitor-ca.crt"';
    }

    # Never serve index.html in place of missing CV binaries or compiled assets.
    location /mediapipe/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { deny all; }

    location = /sw.js {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
