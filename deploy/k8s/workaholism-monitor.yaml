apiVersion: v1
kind: Namespace
metadata:
  name: workaholism-monitor
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: session-logs
  namespace: workaholism-monitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: workaholism-monitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workaholism-monitor
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: workaholism-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workaholism-monitor
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workaholism-monitor
        app.kubernetes.io/component: api
    spec:
      nodeName: cube
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/library/workaholism-monitor-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: DATABASE_URL
              value: file:/data/events.db
            - name: PORT
              value: "3001"
            - name: HOST
              value: 0.0.0.0
            - name: PRISMA_HIDE_UPDATE_MESSAGE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: session-logs
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: workaholism-monitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workaholism-monitor
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: workaholism-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workaholism-monitor
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workaholism-monitor
        app.kubernetes.io/component: web
    spec:
      nodeName: cube
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/library/workaholism-monitor-web:local
          imagePullPolicy: Never
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workaholism-monitor
  namespace: workaholism-monitor
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: web
      port:
        number: 8080
  tls:
    - hosts:
        - workaholism-monitor
